method: derived
source: >-
  openapi/ (both Gravity Connect documents) plus the published guides at
  assets.virtualpeaker.io/gravity-connect/ and the marketing pages virtual-peaker.com/apis/ and
  /partners/device-partners/.
summary: >-
  Gravity Connect conforms to the generic web-API stack (OpenAPI 3.0.0, OAuth 2.0, HMAC-SHA256,
  JSON, ISO 8601, ISO 3166-1 alpha-2, Luhn) and to NO energy-sector interoperability standard. It
  is positioned by its author as an alternative to OpenADR and IEEE 2030.5 rather than an
  implementation of either. Virtual Peaker publishes no security or privacy certification of any
  kind.
