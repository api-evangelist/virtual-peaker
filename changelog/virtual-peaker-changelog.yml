- version: 1.5.2
  date: null
  breaking: false
  surfaces: [device-partner]
  highlights: Fixed the incorrect `baseUrl` to the correct `vpBaseUrl` in the VP Endpoints of the Postman Collection.
- version: 1.5.0
  date: null
  breaking: false
  surfaces: [device-partner]
  highlights: Added the EVSE device type with signals, settings and commands.
- version: 1.4.1
  date: null
  breaking: false
  surfaces: [device-partner]
  highlights: >-
    Added the storage HVAC device type and FAQs; clarified that startTime may be in the past; made
    deviceUids optional when creating a group.
- version: 1.4.0
  date: null
  breaking: true
  surfaces: [device-partner]
  highlights: >-
    Clarified CTA modes, swapping NORMAL in for RUN_NORMAL, and cta-op-modes — an enum value
    rename on the device-type vocabulary.
- version: 1.3.3
  date: null
  breaking: true
  surfaces: [device-partner]
  highlights: >-
    Required `country` when houses are published to the device partner, and specified that the
    field follows ISO 3166-1 alpha-2 (previous documentation referenced `USA` as a value).
- version: 1.3.2
  date: null
  breaking: false
  surfaces: [device-partner]
  highlights: Added an optional array of devices when publishing houses.
- version: 1.3.0
  date: null
  breaking: false
  surfaces: [device-partner]
  highlights: Added an endpoint for individual devices to opt out of a group command (commandOptOut).
- version: 1.2.2
  date: null
  breaking: false
  surfaces: [vpp]
  highlights: Added the maximum payload size (262,144 bytes).
- version: 1.2.1
  date: null
  breaking: false
  surfaces: [vpp]
  highlights: Clarified command status vs device command status reporting.
- version: 1.2.0
  date: null
  breaking: false
  surfaces: [device-partner, vpp]
  highlights: >-
    device-partner — added the "Publish houses for installation" endpoint under a new pairing-code
    onboarding flow, and clarified pairing-code structure and international addresses;
    vpp — clarified that the auth header is `Authorization`, not `Authentication`.
- version: 1.1.0
  date: null
  breaking: false
  surfaces: [device-partner, vpp]
  highlights: >-
    device-partner — added Pairing Code Device Discovery as a proposal and clarified that
    1 program = 1 utility; vpp — added pairingCode as an optional field on Publish device enrollment.
- version: 1.0.1
  date: null
  breaking: false
  surfaces: [device-partner, vpp]
  highlights: >-
    device-partner — `invalidDevices` was documented under the request body for Update group
