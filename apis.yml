- aid: virtual-peaker:virtual-peaker-pairing-code-device-discovery-end-user-app-api
  name: Virtual Peaker Pairing Code Device Discovery - End User App API
  description: >-
    The [pairing code](./device-partner-api.html#section/Pairing-Codes) device discovery flow works as
    follows:

    1. The device owner fills out an onboarding form on Virtual Peaker's site.

    2. At the end of the form, we provide them with a pairing code and instructions to enter it in the
    Device Partner's app.

    3. Optionally, the user selects which devices to enroll via the Device Partner's interface. Otherwise,
    all devices are enrolled by default.

    4. When the user enters the pairing code in the Device Partner's app, the Device Partner publishes
    a device enrollment event to Virtual Peaker's API.

    5. The publish event includes the pairing code, allowing Virtual Peaker to link the device back to
    the onboarding form entry.

    6. If multiple devices are enrolled, the same pairing code is used in each publish payload.

    7. Virtual Peaker discovers the user details associated with the enrolled device(s).

    8. We subscribe to the devices for data publishing and provide a `DEVICE_PUBLISH_SECRET`.


    The user experience is driven through the Device Partner's web or mobile app after receiving the pairing
    code. This links together the Virtual Peaker and Device Partner platforms.
  humanURL: https://assets.virtualpeaker.io/gravity-connect/device-partner-api.html
  baseURL: https://partner.virtualpeaker.io/v1
