- aid: virtual-peaker:virtual-peaker-group-management-api
  name: Virtual Peaker Group Management API
  description: >-
    Virtual Peaker supports managing groups of devices, in addition to individual device control. Grouping
    enables utilities to target clusters of devices together in demand response events.While device telemetry
    and configuration data is still reported on a per-device level, groups allow a single command to be
    broadcast to multiple enrolled devices simultaneously.

    To utilize grouping, the Device Partner integration must support both individual and group commands
    concurrently. The same device could receive an individual command, while also belonging to a group
    receiving a separate directive.

    Group commands have additional considerations:
      1. Devices can opt out of group events individually, while the overall group command remains active.
      2. Group command statuses reflect execution at the scheduling engine level rather than device state.
      3. The Device Partner must reconcile group vs. individual state to ensure consistency in reporting.

    When not specified, all other workflows behave identically between individual and grouped devices
    - enrollment, data publishing, cancellations, etc.
  humanURL: https://assets.virtualpeaker.io/gravity-connect/device-partner-api.html
  baseURL: https://partner.virtualpeaker.io/v1
