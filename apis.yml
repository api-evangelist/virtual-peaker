apis:
- aid: virtual-peaker:gravity-connect-device-partner-api
  name: Gravity Connect API (Device Partner)
  description: >-
    The Device Partner half of Virtual Peaker's Gravity Connect specification — the endpoints a
    device OEM must implement so a VPP or DERMS platform can discover, enroll, read, group, and
    command its behind-the-meter DER devices. Version 2.0.6, OpenAPI 3.0.0, 14 paths / 18
    operations across Devices, Commands, Device Partner Driven Enrollment, OAuth Device Discovery,
    Pairing Code Device Discovery (end-user app and utility-commissioned installation), Group
    Management, and an Energy Interval endpoint. The published `servers` entry is the placeholder
    https://example.com because the OEM, not Virtual Peaker, hosts this surface. Secured with
    OAuth 2.0 — client credentials (scope basic_partner_read_write) for platform-to-partner calls,
    and authorization code (scope user_read) for homeowner-consented device discovery.
  humanURL: https://assets.virtualpeaker.io/gravity-connect/device-partner-api.html
  tags:
  - DER
  - Demand Response
  - Device Control
  - OEM
  - OAuth
  properties:
  - type: OpenAPI
    url: openapi/virtual-peaker-gravity-connect-device-partner-api-openapi.yml
  - type: APIReference
    url: https://assets.virtualpeaker.io/gravity-connect/device-partner-api.html
  - type: Documentation
    url: https://virtual-peaker.com/partners/device-partners/
  - type: Blog
    url: https://virtual-peaker.com/blog/gravity-connect-api-oem-derms-integrations/
  - type: Overlay
    url: overlays/virtual-peaker-gravity-connect-device-partner-api-overlay.yaml
  - type: GettingStarted
    url: https://assets.virtualpeaker.io/gravity-connect/device-partner-api.html#section/Getting-Started
- aid: virtual-peaker:gravity-connect-vpp-api
  name: Gravity Connect API (Virtual Peaker)
  description: >-
    The VPP half of the Gravity Connect specification — the publishing endpoints Virtual Peaker
    hosts so an integrated device partner can stream device signals, settings, command status, and
    enrollment events back into the platform. Version 2.0.6, OpenAPI 3.0.0, 5 paths / 5 operations,
    all under the Publishing tag and all keyed on a per-program PROGRAM_PUBLISH_KEY. Base URL
    https://partner.virtualpeaker.io/v1, confirmed live (AWS API Gateway, anonymous request returns
    HTTP 403 MissingAuthenticationTokenException). Authentication is not OAuth on this side: requests
    are signed with an HMAC-SHA256 of the request body using a PROGRAM_PUBLISH_SECRET or
    DEVICE_PUBLISH_SECRET and sent as `Authorization: Publish <hmac>`.
  humanURL: https://assets.virtualpeaker.io/gravity-connect/vp-api.html
  baseURL: https://partner.virtualpeaker.io/v1
