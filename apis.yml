aid: virtual-peaker
url: https://raw.githubusercontent.com/api-evangelist/virtual-peaker/refs/heads/main/apis.yml
name: Virtual Peaker
kind: company
description: >-
  Virtual Peaker is a Louisville, Kentucky software company selling grid-edge DERMS and
  virtual power plant software to United States and Canadian electric utilities — investor-owned
  utilities, municipal utilities, and rural electric cooperatives. Its platform is sold as three
  suites: Shift (grid-edge DERMS device control and demand response event dispatch), Relay
  (customer engagement, enrollment, and incentive processing), and Envision (demand forecasting).
  Virtual Peaker sits in the private DER-orchestration layer of the energy value chain, between
  device OEMs behind the meter and the utility back office — it is a vendor, not a utility, not a
  retailer, and not a data holder, so no consumer energy data right attaches to it. There is no
  Green Button / ESPI implementation here, no Consumer Data Right obligation, and no open market or
  grid data of any kind. What it does publish is its own API specification: Gravity Connect, an
  OpenAPI 3.0.0 contract (v2.0.6) that Virtual Peaker authored and openly published as a
  vendor-agnostic alternative to OpenADR and IEEE 2030.5 for onboarding and controlling DER devices.
  Gravity Connect is two-sided — the device OEM implements one half, the VPP platform implements the
  other — and both halves are readable anonymously as full Redoc API references. The honest posture:
  a real, downloadable, standards-ambitious API contract that is effectively undiscoverable (it is
  linked from nowhere on the marketing site) and whose credentials are partner-only, issued per
  utility program by emailing the Gravity Connect team. The commercial Shift API is named and sold
  on the marketing site but has no public documentation at all.
