findings:
  summary: >-
    Virtual Peaker is a clean example of the energy sector's real split — and it falls on neither
    side of the mandate story. No consumer data right reaches it, so 'mandate' is genuinely
    not-applicable rather than claimed-and-unverified. It publishes no open market data. What it
    does publish is a proprietary-but-openly-documented integration specification, Gravity Connect
    v2.0.6, in two OpenAPI 3.0.0 halves, explicitly pitched as a modern replacement for OpenADR and
    IEEE 2030.5. Both halves are readable anonymously and were harvested. The gap between ambition
    and practice is the story: a company that says "we encourage all DERMS and VPP platforms to use
    this standard" links to that standard from nowhere on its own website, publishes none of it on
    the GitHub organization it maintains, and issues credentials only inside a contracted utility
    program.
  strengths:
  - Two complete, well-written OpenAPI 3.0.0 documents with a maintained changelog spanning 1.0.1
    to 2.0.6.
  - Honest two-sided modelling — the OEM side ships a placeholder server URL because the OEM hosts
    it, which is correct rather than misleading.
  - Documented auth on both directions, with a worked HMAC example and explicit retry guidance.
  - Real device-type specifications (TSTAT, EVSE, storage HVAC) rather than a generic device blob.
  gaps:
  - No machine-readable spec is served — the OpenAPI exists only embedded inside Redoc HTML; every
    .json and .yaml sibling returns 403.
  - The API references are linked from nowhere public; they are reachable only by reading a
    login-gated SPA's JavaScript bundle.
  - Nothing on GitHub despite the "open-source documentation" framing.
  - No sandbox, no self-service signup, no pricing, no status page, no security.txt.
  - The commercial Shift API is sold by name with no documentation at all.
