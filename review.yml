harvest:
  fetchDate: '2026-07-27'
  specsSaved: 2
  method: >-
    Both Redoc HTML references were downloaded anonymously with curl. Each embeds its complete
    OpenAPI document as a JSON object assigned to `var __redoc_state` in an inline script; the
    `spec.data` object was extracted verbatim and serialized to YAML with no edits, additions, or
    omissions. Both were confirmed to round-trip byte-equivalent in structure and to reparse as
    valid YAML.
  artifacts:
  - path: openapi/virtual-peaker-gravity-connect-device-partner-api-openapi.yml
    sourceURL: https://assets.virtualpeaker.io/gravity-connect/device-partner-api.html
    httpStatus: 200
    fetchDate: '2026-07-27'
    title: Gravity Connect API (Device Partner)
    version: 2.0.6
    openapi: 3.0.0
    paths: 14
    operations: 18
    parsed: true
  - path: openapi/virtual-peaker-gravity-connect-vpp-api-openapi.yml
    sourceURL: https://assets.virtualpeaker.io/gravity-connect/vp-api.html
    httpStatus: 200
    fetchDate: '2026-07-27'
    title: Gravity Connect API (Virtual Peaker)
    version: 2.0.6
    openapi: 3.0.0
    paths: 5
    operations: 5
    parsed: true
  notHarvested:
  - what: Gravity Connect Postman Collection
    why: >-
      The Device Partner changelog entry for 1.5.2 references a Postman Collection ("Fixed using
      incorrect baseUrl to correct vpBaseUrl in VP Endpoints of Postman Collection"), so one exists,
      but every guessed path under assets.virtualpeaker.io/gravity-connect/ returned HTTP 403 and
      the bucket denies listing. Not fabricated.
  - what: Shift API contract
    why: No public documentation of any kind exists. See apiFamily.namedButUndocumented.

